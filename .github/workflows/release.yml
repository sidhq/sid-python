name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: Build ${{ matrix.platform }} ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64
          - platform: macos-15-intel
            target: x86_64
          - platform: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - platform: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - platform: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --locked --compatibility pypi --out dist
      - name: Create wheel smoke-test environment
        if: ${{ !contains(matrix.target, 'musl') }}
        run: python -m venv wheel-venv
      - name: Test wheel on POSIX
        if: ${{ runner.os != 'Windows' && !contains(matrix.target, 'musl') }}
        working-directory: wheel-venv
        shell: bash
        run: |
          bin/python -m pip install ../dist/*.whl
          bin/python -c "import sid; import sid._snippet"
          bin/python -m pip check
      - name: Test musllinux wheel on Alpine
        if: ${{ contains(matrix.target, 'musl') }}
        shell: bash
        run: |
          docker run --rm --volume "${{ github.workspace }}/dist:/dist:ro" python:3.12-alpine sh -c '
            python -m venv /tmp/wheel-venv &&
            /tmp/wheel-venv/bin/python -m pip install /dist/*.whl &&
            /tmp/wheel-venv/bin/python -c "import sid; import sid._snippet" &&
            /tmp/wheel-venv/bin/python -m pip check
          '
      - name: Test wheel on Windows
        if: runner.os == 'Windows'
        working-directory: wheel-venv
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem ../dist/*.whl).FullName
          .\Scripts\python.exe -m pip install $wheel
          .\Scripts\python.exe -c "import sid; import sid._snippet"
          .\Scripts\python.exe -m pip check
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: dist/*.whl

  linux-compatibility:
    name: Install on ${{ matrix.image }}
    needs: wheels
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        image:
          - debian:12-slim
          - debian:13-slim
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest-x86_64
          path: dist
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv venv wheel-venv
      - run: uv pip install --python wheel-venv/bin/python dist/*.whl
      - run: wheel-venv/bin/python -c "import sid; import sid._snippet"
      - run: uv pip check --python wheel-venv/bin/python

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx maturin==1.15.0 sdist --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, linux-compatibility, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install twine
      - run: python -m twine check dist/*
      - run: python -c "import glob; assert len(glob.glob('dist/*.whl')) == 7; assert len(glob.glob('dist/*.tar.gz')) == 1"
      - run: python scripts/check_artifacts.py dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
